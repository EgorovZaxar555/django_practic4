{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Учебный проект{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  {# своя статика приложения #}
  <link rel="stylesheet" href="{% static 'main_practic/css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">
      <img src="{% static 'main_practic/images/logo.png' %}" alt="Логотип" width="30" height="30" class="d-inline-block align-top">
      Учебный проект
    </a>

    <div class="ms-auto d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <span class="text-white-50 small">Вы вошли как <b>{{ user.username }}</b></span>
        <a class="btn btn-outline-light btn-sm" href="{% url 'role-redirect' %}">
          Моя страница
        </a>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-warning btn-sm">Выйти</button>
        </form>
      {% else %}
        <a class="btn btn-primary btn-sm" href="{% url 'login' %}">Войти</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="text-center text-muted py-4 mt-5">
  <small>&copy; {% now "Y" %} Учебный проект</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
