{% extends 'main_practic/base.html' %}
{% block title %}Обновить аватар{% endblock %}

{% block content %}
<h2>Обновить аватар</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Сохранить</button>
</form>

{% if request.user.student_profile.avatar %}
  <p class="mt-3">Текущий:</p>
  <img src="{{ request.user.student_profile.avatar.url }}" alt="avatar" style="max-width:180px;">
{% endif %}
{% endblock %}
